name: PodsPanel release

# Run by hand from the Actions tab. Builds the version named in app/build.gradle.kts, signs it
# with the key kept in the repository secrets, and publishes it as a GitHub release.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: airpods-companion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PODSPANEL_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PODSPANEL_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the repository secrets PODSPANEL_KEYSTORE_BASE64 and PODSPANEL_KEYSTORE_PASSWORD first."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Test and build
        env:
          PODSPANEL_KEYSTORE: ${{ runner.temp }}/release.keystore
          PODSPANEL_KEYSTORE_PASSWORD: ${{ secrets.PODSPANEL_KEYSTORE_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          apk="PodsPanel-$version.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          "$ANDROID_HOME"/build-tools/35.0.0/apksigner verify "$apk"
          gh release create "podspanel-v$version" "$apk" \
            --target "$GITHUB_SHA" \
            --title "PodsPanel $version" \
            --notes "安裝方式與功能說明請見 [README](https://github.com/$GITHUB_REPOSITORY/blob/main/airpods-companion/README.md)。"

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
